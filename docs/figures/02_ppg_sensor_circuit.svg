<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="505" viewBox="0 0 1090 505" role="img" aria-label="Schematic of a PPG front end: MCU PWM switches an NPN transistor that drives the LED through a current-limit resistor; the photodiode current goes into a transimpedance amplifier with feedback resistor and capacitor; then a 0.5 Hz high-pass, a non-inverting gain stage, a 5 Hz low-pass, an ADC and the MCU, which also reads an accelerometer over I2C.">
<style>
svg{color:#17252A;font-family:"IBM Plex Mono",Menlo,Consolas,monospace}
.w{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.wthin{fill:none;stroke:currentColor;stroke-width:1.2}
.box{fill:#FFFFFF;stroke:currentColor;stroke-width:1.6}
.solid{fill:currentColor}
.t{fill:currentColor;font-size:12px}
.ts{fill:#56686D;font-size:11px}
.tb{fill:currentColor;font-size:13px;font-weight:500}
.red{stroke:#C2303B}.redf{fill:#C2303B}
.teal{stroke:#0E7C7B}.tealf{fill:#0E7C7B}
.amber{stroke:#93600A}.amberf{fill:#93600A}
.dash{stroke-dasharray:5 4}
.mutedS{stroke:#56686D}
</style>
<rect width="1090" height="505" fill="#FFFFFF"/>
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="solid"/></marker>
          <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="redf"/></marker>
          <marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="tealf"/></marker>
          <g id="gnd"><line x1="-10" y1="0" x2="10" y2="0" class="w"/><line x1="-6" y1="5" x2="6" y2="5" class="w"/><line x1="-2" y1="10" x2="2" y2="10" class="w"/></g>
        </defs>

        <!-- block labels -->
        <text x="110" y="200" text-anchor="middle" class="ts">LED DRIVER</text>
        <text x="250" y="190" text-anchor="middle" class="ts">PHOTODIODE + TIA</text>
        <text x="530" y="230" text-anchor="middle" class="ts">HPF 0.5 Hz</text>
        <text x="620" y="230" text-anchor="middle" class="ts">GAIN</text>
        <text x="720" y="230" text-anchor="middle" class="ts">LPF 5 Hz</text>

        <!-- ===== LED driver ===== -->
        <line x1="95" y1="220" x2="155" y2="220" class="w"/>
        <text x="125" y="214" text-anchor="middle" class="t">+3.3 V</text>
        <line x1="125" y1="220" x2="125" y2="238" class="w"/>
        <rect x="118" y="238" width="14" height="40" class="box"/>
        <text x="140" y="262" class="t">R_LED</text>
        <line x1="125" y1="278" x2="125" y2="300" class="w"/>
        <!-- LED pointing down -->
        <polygon points="110,300 140,300 125,326" class="box"/>
        <line x1="110" y1="326" x2="140" y2="326" class="w"/>
        <line x1="144" y1="306" x2="162" y2="294" class="w red" marker-end="url(#ahr)"/>
        <line x1="144" y1="318" x2="162" y2="306" class="w red" marker-end="url(#ahr)"/>
        <text x="168" y="300" class="t" style="fill:#C2303B">D1 LED</text>
        <line x1="125" y1="326" x2="125" y2="365" class="w"/>
        <!-- NPN -->
        <circle cx="117" cy="383" r="22" class="wthin"/>
        <line x1="108" y1="370" x2="108" y2="396" class="w"/>
        <line x1="108" y1="377" x2="125" y2="365" class="w"/>
        <line x1="108" y1="389" x2="125" y2="401" class="w" marker-end="url(#ah)"/>
        <text x="146" y="388" class="t">Q1</text>
        <line x1="125" y1="401" x2="125" y2="430" class="w"/>
        <use href="#gnd" x="125" y="430"/>
        <!-- base resistor -->
        <line x1="108" y1="383" x2="90" y2="383" class="w"/>
        <rect x="50" y="376" width="40" height="14" class="box"/>
        <text x="70" y="370" text-anchor="middle" class="t">R_B</text>
        <line x1="50" y1="383" x2="30" y2="383" class="w"/>

        <!-- ===== Photodiode + TIA ===== -->
        <!-- photodiode, cathode up -->
        <polygon points="285,335 315,335 300,310" class="box"/>
        <line x1="285" y1="310" x2="315" y2="310" class="w"/>
        <line x1="262" y1="302" x2="280" y2="316" class="w red" marker-end="url(#ahr)"/>
        <line x1="262" y1="316" x2="280" y2="330" class="w red" marker-end="url(#ahr)"/>
        <text x="290" y="356" text-anchor="end" class="t" style="fill:#C2303B">D2 photodiode</text>
        <line x1="300" y1="335" x2="300" y2="370" class="w"/>
        <use href="#gnd" x="300" y="370"/>
        <line x1="300" y1="310" x2="300" y2="265" class="w"/>
        <line x1="300" y1="265" x2="380" y2="265" class="w"/>
        <circle cx="340" cy="265" r="2.6" class="solid"/>
        <text x="304" y="258" class="ts">I_pd</text>
        <!-- op-amp U1 -->
        <polygon points="380,245 380,315 440,280" class="box"/>
        <text x="386" y="270" class="t">−</text>
        <text x="386" y="300" class="t">+</text>
        <text x="408" y="284" class="ts">U1</text>
        <line x1="380" y1="295" x2="360" y2="295" class="w"/>
        <line x1="360" y1="295" x2="360" y2="320" class="w"/>
        <use href="#gnd" x="360" y="320"/>
        <!-- feedback -->
        <line x1="340" y1="265" x2="340" y2="170" class="w"/>
        <line x1="340" y1="215" x2="370" y2="215" class="w"/>
        <rect x="370" y="208" width="40" height="14" class="box"/>
        <text x="390" y="203" text-anchor="middle" class="t">R_f</text>
        <line x1="410" y1="215" x2="460" y2="215" class="w"/>
        <line x1="340" y1="170" x2="386" y2="170" class="w"/>
        <line x1="386" y1="158" x2="386" y2="182" class="w"/>
        <line x1="394" y1="158" x2="394" y2="182" class="w"/>
        <text x="390" y="150" text-anchor="middle" class="t">C_f</text>
        <line x1="394" y1="170" x2="460" y2="170" class="w"/>
        <line x1="460" y1="170" x2="460" y2="280" class="w"/>
        <line x1="440" y1="280" x2="500" y2="280" class="w"/>
        <circle cx="460" cy="280" r="2.6" class="solid"/>
        <circle cx="340" cy="215" r="2.6" class="solid"/>
        <text x="452" y="346" text-anchor="end" class="ts">V = −I_pd·R_f</text>

        <!-- ===== HPF ===== -->
        <line x1="512" y1="268" x2="512" y2="292" class="w"/>
        <line x1="520" y1="268" x2="520" y2="292" class="w"/>
        <line x1="500" y1="280" x2="512" y2="280" class="w"/>
        <line x1="520" y1="280" x2="560" y2="280" class="w"/>
        <text x="516" y="260" text-anchor="middle" class="t">C_hp</text>
        <circle cx="545" cy="280" r="2.6" class="solid"/>
        <line x1="545" y1="280" x2="545" y2="312" class="w"/>
        <rect x="538" y="312" width="14" height="36" class="box"/>
        <text x="532" y="334" text-anchor="end" class="t">R_hp</text>
        <line x1="545" y1="348" x2="545" y2="362" class="w"/>
        <use href="#gnd" x="545" y="362"/>

        <!-- ===== Gain stage U2 (non-inverting) ===== -->
        <line x1="560" y1="280" x2="560" y2="265" class="w"/>
        <line x1="560" y1="265" x2="590" y2="265" class="w"/>
        <polygon points="590,245 590,315 650,280" class="box"/>
        <text x="596" y="270" class="t">+</text>
        <text x="596" y="300" class="t">−</text>
        <text x="618" y="284" class="ts">U2</text>
        <line x1="650" y1="280" x2="690" y2="280" class="w"/>
        <circle cx="670" cy="280" r="2.6" class="solid"/>
        <line x1="670" y1="280" x2="670" y2="372" class="w"/>
        <line x1="670" y1="372" x2="640" y2="372" class="w"/>
        <rect x="600" y="365" width="40" height="14" class="box"/>
        <text x="620" y="397" text-anchor="middle" class="t">R2</text>
        <line x1="600" y1="372" x2="578" y2="372" class="w"/>
        <circle cx="578" cy="372" r="2.6" class="solid"/>
        <line x1="578" y1="372" x2="578" y2="295" class="w"/>
        <line x1="578" y1="295" x2="590" y2="295" class="w"/>
        <line x1="578" y1="372" x2="578" y2="390" class="w"/>
        <rect x="571" y="390" width="14" height="30" class="box"/>
        <text x="556" y="410" text-anchor="end" class="t">R1</text>
        <line x1="578" y1="420" x2="578" y2="430" class="w"/>
        <use href="#gnd" x="578" y="430"/>
        <text x="626" y="452" text-anchor="middle" class="ts">gain = 1 + R2/R1</text>

        <!-- ===== LPF ===== -->
        <rect x="690" y="273" width="40" height="14" class="box"/>
        <text x="710" y="265" text-anchor="middle" class="t">R_lp</text>
        <line x1="730" y1="280" x2="790" y2="280" class="w"/>
        <circle cx="755" cy="280" r="2.6" class="solid"/>
        <line x1="755" y1="280" x2="755" y2="304" class="w"/>
        <line x1="743" y1="304" x2="767" y2="304" class="w"/>
        <line x1="743" y1="312" x2="767" y2="312" class="w"/>
        <text x="737" y="312" text-anchor="end" class="t">C_lp</text>
        <line x1="755" y1="312" x2="755" y2="330" class="w"/>
        <use href="#gnd" x="755" y="330"/>

        <!-- ===== ADC + MCU ===== -->
        <rect x="790" y="250" width="80" height="60" class="box"/>
        <text x="830" y="276" text-anchor="middle" class="tb">ADC</text>
        <text x="830" y="294" text-anchor="middle" class="ts">64 Hz</text>
        <line x1="870" y1="280" x2="910" y2="280" class="w" marker-end="url(#ah)"/>
        <rect x="910" y="230" width="150" height="100" class="box"/>
        <text x="985" y="270" text-anchor="middle" class="tb">MCU</text>
        <text x="985" y="290" text-anchor="middle" class="ts">runs HR algorithm</text>
        <!-- accelerometer -->
        <rect x="910" y="380" width="150" height="50" class="box" style="stroke:#0E7C7B"/>
        <text x="985" y="402" text-anchor="middle" class="tb" style="fill:#0E7C7B">Accelerometer</text>
        <text x="985" y="419" text-anchor="middle" class="ts">3-axis, 32 Hz</text>
        <line x1="985" y1="380" x2="985" y2="332" class="w teal" marker-end="url(#aht)"/>
        <text x="993" y="360" class="t" style="fill:#0E7C7B">I²C</text>
        <!-- output -->
        <line x1="1060" y1="280" x2="1082" y2="280" class="w" marker-end="url(#ah)"/>
        <text x="1074" y="268" text-anchor="end" class="ts">HR</text>

        <!-- PWM back to LED driver -->
        <path d="M985,230 L985,120 L30,120 L30,383" class="w dash mutedS"/>
        <text x="500" y="112" text-anchor="middle" class="ts">LED_EN (PWM) — LED pulsed on only while sampling</text>

        <!-- DC tap -->
        <path d="M460,280 L460,486 L830,486 L830,312" class="w dash mutedS" marker-end="url(#ah)"/>
        <text x="645" y="480" text-anchor="middle" class="ts">DC tap → 2nd ADC channel (needed for perfusion index)</text>
      </svg>
